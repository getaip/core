      WA_ACK_RETENTION_DAYS: "30"
      WA_REALTIME_AGENT_ENABLED: "false"
      WA_NOTIFICATIONS_ENABLED: "false"
      WA_DISK_WARNING_PERCENT: "90"
      WA_DISK_CRITICAL_PERCENT: "97"
      WA_DISK_MINIMUM_FREE_BYTES: "2147483648"
