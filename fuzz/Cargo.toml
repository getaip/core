[package]
name = "aip-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
aip-core = { path = "../crates/aip-core" }
aip-crypto = { path = "../crates/aip-crypto" }
aip-profile-mcp = { path = "../crates/aip-profile-mcp" }
aip-profile-webhook = { path = "../crates/aip-profile-webhook" }
aip-schema = { path = "../crates/aip-schema" }
libfuzzer-sys = "0.4"
serde_json = "1"
time = "0.3"

[workspace]

[[bin]]
name = "envelope_parse"
path = "fuzz_targets/envelope_parse.rs"
test = false
doc = false

[[bin]]
name = "canonical_json"
path = "fuzz_targets/canonical_json.rs"
test = false
doc = false

[[bin]]
name = "mcp_mapping"
path = "fuzz_targets/mcp_mapping.rs"
test = false
doc = false

[[bin]]
name = "webhook_signature"
path = "fuzz_targets/webhook_signature.rs"
test = false
doc = false

[[bin]]
name = "schema_validation"
path = "fuzz_targets/schema_validation.rs"
test = false
doc = false
