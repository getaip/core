name: npm-trusted-publishing

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact already-published GetAIP release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-trusted-publishing-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    name: publish-scoped-then-short-launcher
    if: ${{ vars.NPM_TRUSTED_PUBLISHING_READY == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.release.draft == false && github.event.release.prerelease == false)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: npm-production
    permissions:
      contents: read
      id-token: write
      attestations: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      scoped_integrity: ${{ steps.packages.outputs.scoped_integrity }}
      short_integrity: ${{ steps.packages.outputs.short_integrity }}
    steps:
      - name: Checkout the exact published tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Install Rust for native release verification
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: npm-release-verification

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install the exact Trusted Publishing npm client
        run: |
          npm install --global --ignore-scripts npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Verify public release identity and download every native asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$TAG
          version=${tag#v}
          test "$tag" = "v${version}"
          test "$version" = "$(node -p 'require("./package.json").version')"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public
          test "$(git cat-file -t "refs/tags/$tag")" = tag
          test "$(git rev-parse "refs/tags/$tag^{}")" = "$(git rev-parse HEAD)"
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = false
          mkdir native-release
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir native-release
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Re-verify signatures, checksums, archives, and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=${{ steps.release.outputs.version }}
          for asset in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            chmod 0755 "native-release/getaip-${version}-${asset}"
          done
          cargo run --locked -p xtask -- verify-native-release \
            --directory native-release \
            --manifest native-release/getaip-distribution-manifest.v1.json \
            --signature native-release/getaip-distribution-manifest.v1.json.sig
          while read -r _digest name; do
            gh attestation verify "native-release/$name" --repo "$GITHUB_REPOSITORY"
          done < native-release/SHA256SUMS

      - name: Verify npm source, tests, and exact package contents
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check
          git diff --exit-code

      - name: Pack both immutable npm candidates
        id: packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir npm-candidate
          npm pack ./packages/getaip-cli --json --ignore-scripts \
            --pack-destination npm-candidate > scoped-pack.json
          npm pack ./packages/getaip --json --ignore-scripts \
            --pack-destination npm-candidate > short-pack.json
          echo "scoped_integrity=$(jq -er '.[0].integrity' scoped-pack.json)" >> "$GITHUB_OUTPUT"
          echo "short_integrity=$(jq -er '.[0].integrity' short-pack.json)" >> "$GITHUB_OUTPUT"

      - name: Publish or prove the exact scoped bootstrap first
        env:
          EXPECTED_INTEGRITY: ${{ steps.packages.outputs.scoped_integrity }}
        shell: bash
        run: |
          set -euo pipefail
          version=${{ steps.release.outputs.version }}
          published=$(npm view "@getaip/cli@${version}" dist.integrity 2>/dev/null || true)
          if test -z "$published" || test "$published" = null; then
            npm publish ./packages/getaip-cli --access public --provenance
          fi
          for attempt in 1 2 3 4 5 6; do
            published=$(npm view "@getaip/cli@${version}" dist.integrity 2>/dev/null || true)
            test "$published" = "$EXPECTED_INTEGRITY" && break
            test "$attempt" -lt 6
            sleep 10
          done
          test "$published" = "$EXPECTED_INTEGRITY"

      - name: Install and verify the scoped package from the public registry
        shell: bash
        run: |
          set -euo pipefail
          version=${{ steps.release.outputs.version }}
          boundary=$(mktemp -d)
          npm install --prefix "$boundary" --ignore-scripts \
            "@getaip/cli@${version}"
          test "$(node -p "require('$boundary/node_modules/@getaip/cli/package.json').version")" = "$version"
          test ! -e "$boundary/node_modules/@getaip/cli/node_modules"
          npm audit signatures --prefix "$boundary"

      - name: Publish or prove the exact short launcher second
        env:
          EXPECTED_INTEGRITY: ${{ steps.packages.outputs.short_integrity }}
        shell: bash
        run: |
          set -euo pipefail
          version=${{ steps.release.outputs.version }}
          published=$(npm view "getaip@${version}" dist.integrity 2>/dev/null || true)
          if test -z "$published" || test "$published" = null; then
            npm publish ./packages/getaip --access public --provenance
          fi
          for attempt in 1 2 3 4 5 6; do
            published=$(npm view "getaip@${version}" dist.integrity 2>/dev/null || true)
            test "$published" = "$EXPECTED_INTEGRITY" && break
            test "$attempt" -lt 6
            sleep 10
          done
          test "$published" = "$EXPECTED_INTEGRITY"

      - name: Install and verify the short launcher provenance
        shell: bash
        run: |
          set -euo pipefail
          version=${{ steps.release.outputs.version }}
          boundary=$(mktemp -d)
          npm install --prefix "$boundary" --ignore-scripts "getaip@${version}"
          test "$(node -p "require('$boundary/node_modules/getaip/package.json').version")" = "$version"
          test "$(node -p "require('$boundary/node_modules/@getaip/cli/package.json').version")" = "$version"
          npm audit signatures --prefix "$boundary"

      - name: Retain registry identity and integrity evidence
        run: |
          version=${{ steps.release.outputs.version }}
          npm view "@getaip/cli@${version}" \
            name version dist.integrity dist.tarball dist.attestations engines repository --json > scoped-registry-evidence.json
          npm view "getaip@${version}" \
            name version dependencies dist.integrity dist.tarball dist.attestations engines repository --json > short-registry-evidence.json
          for evidence in scoped-registry-evidence.json short-registry-evidence.json; do
            test "$(jq -er '.dist.attestations.provenance.predicateType' "$evidence")" = \
              https://slsa.dev/provenance/v1
            jq -er '.dist.attestations.url | startswith("https://registry.npmjs.org/-/npm/v1/attestations/")' \
              "$evidence" > /dev/null
          done

      - name: Upload npm publication evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: npm-publication-${{ env.RELEASE_TAG }}-${{ github.sha }}
          path: |
            scoped-pack.json
            short-pack.json
            scoped-registry-evidence.json
            short-registry-evidence.json
            npm-candidate/*.tgz
          if-no-files-found: error
          retention-days: 90

  public-install:
    name: npx-install-${{ matrix.asset }}
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: darwin-arm64
          - runner: macos-15-intel
            asset: darwin-x64
          - runner: ubuntu-24.04-arm
            asset: linux-arm64
          - runner: ubuntu-24.04
            asset: linux-x64
    steps:
      - name: Install the minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          package-manager-cache: false

      - name: Install from npm without Rust and qualify the native lifecycle
        shell: bash
        run: |
          set -euo pipefail
          version=${{ needs.publish.outputs.version }}
          root="$RUNNER_TEMP/getaip-public-install"
          mkdir -p "$root/home" "$root/npm-cache"
          export HOME="$root/home"
          export npm_config_cache="$root/npm-cache"
          npx --yes "getaip@${version}" setup \
            --dry-run --output json --test-root "$root/install" --codex --global --yes \
            > "$root/setup-dry-run.json"
          npx --yes "getaip@${version}" setup \
            --output json --test-root "$root/install" --codex --global --yes \
            > "$root/setup.json"
          npx --yes "getaip@${version}" setup \
            --output json --test-root "$root/install" --codex --global --yes \
            > "$root/setup-idempotent.json"
          cli="$root/install/data/versions/${version}/bin/getaip"
          server="$root/install/data/versions/${version}/bin/getaip-server"
          test -x "$cli"
          test -x "$server"
          test "$("$cli" --version)" = "getaip ${version}"
          test "$("$server" --version)" = "getaip-server ${version}"
          "$cli" doctor --output json --test-root "$root/install" > "$root/doctor.json"
          "$cli" status --output json --test-root "$root/install" > "$root/status.json"
          "$cli" serve --help > "$root/serve-help.txt"
          "$cli" uninstall --dry-run --output json --test-root "$root/install" \
            > "$root/uninstall-dry-run.json"
          "$cli" uninstall --output json --test-root "$root/install" \
            > "$root/uninstall.json"
          test ! -e "$root/install/data/current"

      - name: Upload platform installation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: npm-install-${{ matrix.asset }}-${{ github.sha }}
          path: ${{ runner.temp }}/getaip-public-install/*.json
          if-no-files-found: error
          retention-days: 90

  production-marker:
    name: attest-final-production-marker
    needs: [publish, public-install]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-marker
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout the exact published tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Install Rust for final standalone verification
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: production-marker

      - name: Download the four public-install evidence sets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: npm-install-*-${{ github.sha }}
          path: public-install-evidence

      - name: Resolve and download the exact private-candidate evidence
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          release_commit=$(git rev-parse HEAD)
          release_tree=$(git rev-parse 'HEAD^{tree}')
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          test "$(git rev-parse "refs/tags/$TAG^{}")" = "$release_commit"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = public
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = false
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -qx 'getaip-production-marker.v1.json'; then
            echo "immutable production marker already exists" >&2
            exit 1
          fi

          immutable_run=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --commit "$release_commit" \
            --status success \
            --limit 20 \
            --json databaseId,event,headSha,conclusion \
            | jq -er --arg sha "$release_commit" \
              '[.[] | select(.event == "push" and .headSha == $sha and .conclusion == "success")][0].databaseId')
          mkdir -p native-release immutable-evidence/images immutable-evidence/native-qualification
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir native-release
          gh run download "$immutable_run" --repo "$GITHUB_REPOSITORY" \
            --pattern 'digest-*' --dir immutable-evidence/images
          gh run download "$immutable_run" --repo "$GITHUB_REPOSITORY" \
            --pattern 'native-qualification-*' \
            --dir immutable-evidence/native-qualification
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"
          echo "release_tree=$release_tree" >> "$GITHUB_OUTPUT"
          echo "immutable_run=$immutable_run" >> "$GITHUB_OUTPUT"

      - name: Re-verify the public native release and npm registry identities
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          version=${TAG#v}
          for asset in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            chmod 0755 "native-release/getaip-${version}-${asset}"
          done
          cargo run --locked -p xtask -- verify-native-release \
            --directory native-release \
            --manifest native-release/getaip-distribution-manifest.v1.json \
            --signature native-release/getaip-distribution-manifest.v1.json.sig
          while read -r _digest name; do
            gh attestation verify "native-release/$name" --repo "$GITHUB_REPOSITORY"
          done < native-release/SHA256SUMS
          npm view "@getaip/cli@${version}" \
            name version dist.integrity dist.tarball dist.attestations engines repository --json \
            > scoped-registry-evidence.json
          npm view "getaip@${version}" \
            name version dependencies dist.integrity dist.tarball dist.attestations engines repository --json \
            > short-registry-evidence.json
          test "$(jq -er '.dist.integrity' scoped-registry-evidence.json)" = "${{ needs.publish.outputs.scoped_integrity }}"
          test "$(jq -er '.dist.integrity' short-registry-evidence.json)" = "${{ needs.publish.outputs.short_integrity }}"
          for evidence in scoped-registry-evidence.json short-registry-evidence.json; do
            test "$(jq -er '.dist.attestations.provenance.predicateType' "$evidence")" = \
              https://slsa.dev/provenance/v1
            jq -er '.dist.attestations.url | startswith("https://registry.npmjs.org/-/npm/v1/attestations/")' \
              "$evidence" > /dev/null
          done

      - name: Create and internally verify the exact production marker
        env:
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          marked_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          python3 tools/release/create-production-marker.py \
            --source-snapshot SOURCE_SNAPSHOT.json \
            --publication-manifest PUBLICATION_MANIFEST.json \
            --native-release native-release \
            --image-evidence immutable-evidence/images \
            --native-qualification immutable-evidence/native-qualification \
            --public-install-evidence public-install-evidence \
            --scoped-npm-evidence scoped-registry-evidence.json \
            --launcher-npm-evidence short-registry-evidence.json \
            --tag "$TAG" \
            --github-commit "${{ steps.release.outputs.release_commit }}" \
            --github-tree "${{ steps.release.outputs.release_tree }}" \
            --immutable-run-id "${{ steps.release.outputs.immutable_run }}" \
            --npm-run-id "$GITHUB_RUN_ID" \
            --marked-at "$marked_at" \
            --output getaip-production-marker.v1.json
          cp getaip-production-marker.v1.json native-release/
          cargo run --locked -p xtask -- verify-native-release \
            --directory native-release \
            --manifest native-release/getaip-distribution-manifest.v1.json \
            --signature native-release/getaip-distribution-manifest.v1.json.sig

      - name: Attest the final production marker
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: getaip-production-marker.v1.json

      - name: Publish and clone-back verify the immutable production marker
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify getaip-production-marker.v1.json --repo "$GITHUB_REPOSITORY"
          gh release upload "$TAG" getaip-production-marker.v1.json \
            --repo "$GITHUB_REPOSITORY"
          mkdir marker-clone-back
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern getaip-production-marker.v1.json \
            --dir marker-clone-back
          cmp getaip-production-marker.v1.json \
            marker-clone-back/getaip-production-marker.v1.json
          marker_sha=$(sha256sum getaip-production-marker.v1.json | awk '{print $1}')
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json body --jq .body > release-notes.txt
          python3 - "$marker_sha" "$GITHUB_RUN_ID" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path("release-notes.txt")
          body = path.read_text(encoding="utf-8").rstrip()
          section = (
              "\n\n## Production marker\n\n"
              f"- Status: production\n"
              f"- Marker asset: `getaip-production-marker.v1.json`\n"
              f"- Marker SHA-256: `{sys.argv[1]}`\n"
              f"- npm/public-install workflow run: `{sys.argv[2]}`\n"
          )
          path.write_text(body + section, encoding="utf-8")
          PY
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes.txt

      - name: Retain final production evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: production-marker-${{ env.RELEASE_TAG }}-${{ github.sha }}
          path: |
            getaip-production-marker.v1.json
            scoped-registry-evidence.json
            short-registry-evidence.json
          if-no-files-found: error
          retention-days: 90
