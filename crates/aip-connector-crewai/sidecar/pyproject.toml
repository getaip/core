[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aip-crewai-sidecar"
version = "1.0.0"
description = "Production sidecar binding CrewAI execution to the AIP connector contract"
requires-python = ">=3.10,<3.14"
license = { text = "BUSL-1.1" }
dependencies = [
  "crewai==1.15.13",
  "fastapi==0.139.2",
  "pydantic==2.12.5",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
]

[project.scripts]
aip-crewai-sidecar = "aip_crewai_sidecar.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["aip_crewai_sidecar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
